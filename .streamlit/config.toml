# Axion Local çalışma ayarları (Windows başlatıcısı ve `make run` bunları kullanır).
[server]
port = 8501
headless = true
maxUploadSize = 4096

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Axion logosuna uygun beyaz tema: lacivert #123249, açık mavi #BEE1E8, yeşil #D0E491.
[theme]
base = "light"
primaryColor = "#123249"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F7FA"
textColor = "#1B2B3A"
