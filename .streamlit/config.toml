# Axion Local çalışma ayarları (Windows başlatıcısı ve `make run` bunları kullanır).
[server]
port = 8501
headless = true
maxUploadSize = 4096

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Açık/karanlık tema bilgisayarın ayarını izler; ikisinde de Axion kırmızısı.
[theme.light]
primaryColor = "#BE1824"

[theme.dark]
primaryColor = "#E0343F"
